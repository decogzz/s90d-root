version = 1
# sdb path: set for your host. (Example value for this setup.)
sdb = "C:/Users/decog/s90d-root/tools/tizen-sdb/sdb.exe"

# S90D sdbd clogs if injections retry while a /dev/tcp callback is still
# hanging (~2 min). Keep these slower than the default 1/2/5/10/20s.
[retry]
delays = [30.0, 60.0, 90.0, 120.0]

# NOTE: post_root_commands below is GENERATED from config/debloat.services
# by scripts/debloat.py sync — do not edit by hand; edit the services file.
[televisions.s90d]
model = "archive"
host = "192.168.50.36"  # example; real value lives in the gitignored config/
root_on_presence = true
disable_native_execution_policy = false
# Re-applied after every successful root acquisition (TV reboot / new lease).
# Volatile /run masks only — a reboot returns the TV to stock.
# The unit list comes from config/debloat.services.
# The second command freezes the Discover tile apps and deletes Recommended.
post_root_commands = [
  "for s in adagent-service.service contents-recognition-service.service contents-cognition-service-manager.service contents-ui-detector-service.service screen-analysis-service-manager.service abnormal_user_behavior.service org.tizen.remotepc.service slive-provider-daemon.service reporterCA.service scs-agent.service pushd.service register-device.service registertv-service.service registerav-service.service org.tizen.tv.tagpro-service-tv.service mirroring-recognition-manager.service aifw-msf-service.service canalysis-service.service org.tizen.tv.sp-kpi.service emergency-log-transmitter.service sesd.service user-presence.service wifi-presence.service wifi-presence.path ContentServiceManager.service content-tiles-provider.service content-grab-service.service content-grab-service.path content-db-provider.service csf-content-engine.service com.samsung.tv.preview-updater.service pisa-service.service pisa-service.path pisa-service.socket swu-auto-upgrade.service was-background-update.service was-background-update.path org.tizen.tv.automation-service.service org.tizen.tv.automation-service.path vddebugmenu.service muse-server.service org.tizen.aitech_daemon_service.service org.tizen.NPUManager.service aifw-data-manager.service com.samsung.tv.ai-interpreter-service.service com.samsung.tv.context-aware-agent.service com.samsung.tv.context-aware-service.service; do systemctl mask --runtime --now $s; done",
  "mkdir -p /run/s90d; echo '#!/bin/sh' > /run/s90d/hold; echo 'while true; do sleep 3600; done' >> /run/s90d/hold; chmod 755 /run/s90d/hold; for b in /opt/usr/apps/com.samsung.tv.contentservicemanager/bin/contentservicemanager /opt/usr/apps/com.samsung.tv.contentservicemanager/bin/content-tiles-provider; do mountpoint -q $b || mount --bind /run/s90d/hold $b; done; pids=$(pidof contentservicemanager content-tiles-provider); if [ -n \"$pids\" ]; then kill -STOP $pids; fi; echo \"delete from tiles where section_id in (select _id from sections where title like '%Recommended%' or title like '%Top Picks%' or title = 'Good afternoon'); delete from sections where title like '%Recommended%' or title like '%Top Picks%' or title = 'Good afternoon');\" > /run/s90d/clear.sql; sqlite3 /home/owner/apps_rw/com.samsung.tv.contentservicemanager/data/.preview.db < /run/s90d/clear.sql; app_launcher -t com.samsung.tv.home.media; echo \"delete from preview where Parent in (select Id from preview where Parent = 'tvplus_foryou'); delete from preview where Parent = 'tvplus_foryou' or Id = 'tvplus_foryou'; delete from preview where Parent like 'RECOMMENDED-%' or Id like 'RECOMMENDED-%' or Parent = 'CategoryID_Content_RECOMMENDED' or Id = 'CategoryID_Content_RECOMMENDED' or Id = 'd/apps.tab.content@CategoryID_Content_RECOMMENDED' or Parent like 'EDITORSCHOICE-%' or Id like 'EDITORSCHOICE-%' or Parent = 'CategoryID_Content_EDITORSCHOICE' or Id = 'CategoryID_Content_EDITORSCHOICE' or Id = 'd/apps.tab.content@CategoryID_Content_EDITORSCHOICE' or Parent like 'HEALTHFITNESSWW-%' or Id like 'HEALTHFITNESSWW-%' or Parent = 'CategoryID_Content_HEALTHFITNESSWW' or Id = 'CategoryID_Content_HEALTHFITNESSWW' or Id = 'd/apps.tab.content@CategoryID_Content_HEALTHFITNESSWW' or Parent like 'LIFESTYLEAPPSWW-%' or Id like 'LIFESTYLEAPPSWW-%' or Parent = 'CategoryID_Content_LIFESTYLEAPPSWW' or Id = 'CategoryID_Content_LIFESTYLEAPPSWW' or Id = 'd/apps.tab.content@CategoryID_Content_LIFESTYLEAPPSWW' or Parent like 'CM_GAMING-%' or Id like 'CM_GAMING-%' or Parent = 'CategoryID_Content_CM_GAMING' or Id = 'CategoryID_Content_CM_GAMING' or Id = 'd/apps.tab.content@CategoryID_Content_CM_GAMING' or Parent like 'POPULAR_THIS_WEEK-%' or Id like 'POPULAR_THIS_WEEK-%' or Parent = 'CategoryID_Content_POPULAR_THIS_WEEK' or Id = 'CategoryID_Content_POPULAR_THIS_WEEK' or Id = 'd/apps.tab.content@CategoryID_Content_POPULAR_THIS_WEEK' or Parent like 'BESTAPPS-%' or Id like 'BESTAPPS-%' or Parent = 'CategoryID_Content_BESTAPPS' or Id = 'CategoryID_Content_BESTAPPS' or Id = 'd/apps.tab.content@CategoryID_Content_BESTAPPS' or Parent like 'GROUPCONTENT-%' or Id like 'GROUPCONTENT-%' or Parent = 'CategoryID_Content_GROUPCONTENT' or Id = 'CategoryID_Content_GROUPCONTENT' or Id = 'd/apps.tab.content@CategoryID_Content_GROUPCONTENT' or Parent like 'GENRE-%' or Id like 'GENRE-%' or Parent = 'CategoryID_Content_GENRE' or Id = 'CategoryID_Content_GENRE' or Id = 'd/apps.tab.content@CategoryID_Content_GENRE'; update preview set Childs = 'd/apps.tab.content@CategoryID_Content_DOWNLOADED,d/apps.tab.content@CategoryID_Content_SETTING,s/terra.bottom@d/apps.tab' where Id = 'd/apps.tab';\" > /run/s90d/clear-foryou.sql; sqlite3 /home/owner/apps_rw/com.samsung.tv.home.media/data/coba.db < /run/s90d/clear-foryou.sql; printf '' > /home/owner/apps_rw/com.samsung.tv.home.media/data/.RecentSectionCache; if [ -f /home/owner/.s90d/DataCache.trimmed ]; then nsenter -t 1 -m mountpoint -q /home/owner/share/AppsTab/dataCache/DataCache.dat || nsenter -t 1 -m mount --bind /home/owner/.s90d/DataCache.trimmed /home/owner/share/AppsTab/dataCache/DataCache.dat; nsenter -t 1 -m mount -o remount,bind,ro /home/owner/share/AppsTab/dataCache/DataCache.dat; fi; app_launcher -t com.samsung.tv.csfs; if [ -f /home/owner/.s90d/apps-watch.b64 ] && ! ps -A -o args | grep -q '[a]pps-watch.b64'; then setsid sh -c 'base64 -d /home/owner/.s90d/apps-watch.b64 | sh' >/tmp/apps-watch.log 2>&1 & fi",
]

[televisions.s90d.remote]
enabled = true
devices = [
  { name = "wt61p807 rc device", transport = "bluetooth", model = "VG" },
]
rules = [
  { device = "wt61p807 rc device", key = "XF86Home", action = "app.launch", app = "FreeMyTVio.FreeMyTV" },
]

[televisions.s90d.events]
enabled = false
hdmi_receiver = false
